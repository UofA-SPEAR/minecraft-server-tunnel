[Interface]
Address = 10.0.0.1/24
ListenPort = 51820
PrivateKey = <PRIVATE_KEY>

# Forward incoming Minecraft connections (port 25565) into the tunnel to 10.0.0.2
PostUp = iptables -A FORWARD -i eth0 -o %i -p tcp --dport 25565 -j ACCEPT
PostUp = iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 25565 -j DNAT --to-destination 10.0.0.2:25565
PostUp = iptables -t nat -A POSTROUTING -o %i -j MASQUERADE

PostDown = iptables -D FORWARD -i eth0 -o %i -p tcp --dport 25565 -j ACCEPT
PostDown = iptables -t nat -D PREROUTING -i eth0 -p tcp --dport 25565 -j DNAT --to-destination 10.0.0.2:25565
PostDown = iptables -t nat -D POSTROUTING -o %i -j MASQUERADE

[Peer]
PublicKey = <PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32
