name: spearmc

services:
  server:
    extends:
      file: compose-base.yaml
      service: base
    container_name: spearmc-server

    security_opt:
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config-server:/config
      - ./keys:/keys
      # - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
      - "25565:25565/tcp"
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

    command:
      - bash

  proxy:
    extends:
      file: compose-base.yaml
      service: base
    container_name: spearmc-proxy

    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config-proxy:/config
      - ./keys:/keys
      # - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"   # WireGuard tunnel port
      - "25565:25565/tcp"   # External Minecraft player port
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

    command:
      - bash
